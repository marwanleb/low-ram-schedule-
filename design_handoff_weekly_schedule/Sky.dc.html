<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;padding:0;height:100%;background:#0c0e12}
</style>
</helmet>
<div ref="{{ hostRef }}" style="position:absolute;inset:0;overflow:hidden;background:#0c0e12">
  <canvas ref="{{ canvasRef }}" style="display:block;width:100%;height:100%;image-rendering:pixelated"></canvas>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:560},&quot;seed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;min&quot;:1,&quot;max&quot;:40,&quot;tsType&quot;:&quot;number&quot;},&quot;waterline&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.42,&quot;min&quot;:0.2,&quot;max&quot;:0.8,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Scene&quot;},&quot;liveTime&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Time of day&quot;},&quot;hour&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:12,&quot;min&quot;:0,&quot;max&quot;:24,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Time of day&quot;},&quot;dayCycle&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Time of day&quot;}}">
const PX = 7;
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const CORAL = [
  { hi:'#FFD968', mid:'#F5B942', lo:'#9E6A18' },
  { hi:'#DCA7F5', mid:'#B57BE0', lo:'#6E4096' },
  { hi:'#FF9E86', mid:'#E8604C', lo:'#8F3226' },
  { hi:'#B7F0C9', mid:'#6FD08C', lo:'#31734A' }
];
const FISH = ['#FFCF95','#7FD0EC','#FF8A76','#C79BF0','#8FD6A8','#F5B942'];

// hour, zenith, horizon, light (sun/moon glow)
const DAY = [
  [0,   '#050b1c', '#0d1b38', '#cfe0ff'],
  [4.5, '#0d1a36', '#2c2b4f', '#cfe0ff'],
  [6.2, '#33507f', '#f0a37a', '#ffb37a'],
  [8,   '#5f9fd0', '#cfe7f2', '#ffe9c0'],
  [12,  '#4f97d4', '#cfeaf6', '#fff0c4'],
  [16.5,'#4f8fc4', '#e8dca8', '#ffe1a0'],
  [19,  '#3a5f96', '#f09a63', '#ff9a5e'],
  [20.6,'#22375f', '#b8564f', '#ff7d55'],
  [22,  '#0a1430', '#14203c', '#cfe0ff'],
  [24,  '#050b1c', '#0d1b38', '#cfe0ff']
];

function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function lerp(a, b, t) { return [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t)]; }
function css(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a === undefined ? 1 : a) + ')'; }
function ramp(top, bot, n, gamma) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(lerp(top, bot, Math.pow(i / (n - 1), gamma || 1)));
  return out;
}
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

class Component extends DCLogic {
  hostRef = el => { this.host = el; };
  canvasRef = el => { this.canvas = el; };

  componentDidMount() {
    this.f = 0;
    this.build();
    this.onResize = () => { clearTimeout(this._rz); this._rz = setTimeout(() => this.build(), 120); };
    window.addEventListener('resize', this.onResize);
    // the app lives in the tray: never burn frames while hidden
    this.onVis = () => {
      if (document.hidden) {
        clearTimeout(this._to);
        this._to = null;
        this._paused = true;
      } else if (this._paused) {
        this._paused = false;
        this.bake();
        this.loop();
      }
    };
    document.addEventListener('visibilitychange', this.onVis);
    this.loop = () => {
      if (document.hidden) { this._paused = true; return; }
      this.f += 1;
      const W = this.W;
      this.clouds.forEach(c => { c.x += c.spd; if (c.x > W + c.r + 10) c.x = -c.r - 10; });
      this.fish.forEach(f => {
        f.x += f.spd * f.dir;
        if (f.dir > 0 && f.x > W + 8) f.x = -8;
        if (f.dir < 0 && f.x < -8) f.x = W + 8;
      });
      if (this.f % 20 === 0) this.bake();
      this.paint();
      this._to = setTimeout(() => requestAnimationFrame(this.loop), 300);
    };
    if (!document.hidden) this.loop(); else this._paused = true;
  }

  componentDidUpdate(prev) {
    if (prev.seed !== this.props.seed || prev.waterline !== this.props.waterline) this.build();
    else this.bake();
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    document.removeEventListener('visibilitychange', this.onVis);
    clearTimeout(this._to); clearTimeout(this._rz);
  }

  hour() {
    if (window.__skyHour !== undefined) return window.__skyHour;
    if (this.props.liveTime === false) return this.props.hour ?? 12;
    if (this.props.dayCycle) return (this.f * 0.06) % 24;
    const d = new Date();
    return d.getHours() + d.getMinutes() / 60;
  }

  palette() {
    const h = this.hour();
    let i = 0;
    for (let k = 0; k < DAY.length - 1; k++) if (h >= DAY[k][0]) i = k;
    const a = DAY[i], b = DAY[i + 1];
    const t = Math.max(0, Math.min(1, (h - a[0]) / (b[0] - a[0])));
    return {
      hour: h,
      zenith: lerp(hexRGB(a[1]), hexRGB(b[1]), t),
      horizon: lerp(hexRGB(a[2]), hexRGB(b[2]), t),
      light: lerp(hexRGB(a[3]), hexRGB(b[3]), t)
    };
  }

  build() {
    const host = this.host, c = this.canvas;
    if (!host || !c) return;
    const W = Math.max(40, Math.ceil(host.clientWidth / PX));
    const H = Math.max(40, Math.ceil(host.clientHeight / PX));
    this.W = W; this.H = H;
    this.wl = Math.round(H * (this.props.waterline ?? 0.42));
    this.sandTop = H - Math.max(4, Math.round((H - this.wl) * 0.2));
    this.sandY = [];
    for (let x = 0; x < W; x++) {
      this.sandY.push(Math.round(this.sandTop + Math.sin(x * 0.055) * 1.6 + Math.sin(x * 0.017 + 1.2) * 2.2 + Math.sin(x * 0.13) * 0.6));
    }
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    this.ctx = ctx;

    const r = mulberry(this.props.seed ?? 7);
    const wl = this.wl;

    const nC = Math.max(5, Math.round(W / 22));
    this.clouds = [];
    for (let k = 0; k < nC; k++) {
      const rad = 5 + Math.floor(r() * 7);
      const count = 3 + Math.floor(r() * 3);
      this.clouds.push({
        x: ((k + r() * 0.9) / nC) * W,
        y: 4 + Math.floor(r() * Math.max(4, wl * 0.55)),
        r: rad * 2,
        spd: 0.16 + r() * 0.22,
        lobes: Array.from({ length: count }, (_, j) => {
          const mid = (j + 0.5) / count - 0.5;
          const ry = rad * (0.55 + r() * 0.5) * (1 - Math.abs(mid) * 0.7);
          return { dx: mid * rad * 3.1 + (r() - 0.5) * rad * 0.4, dy: -ry * 0.5 + (r() - 0.5) * rad * 0.3, rx: ry * (1.15 + r() * 0.45), ry: Math.max(1.4, ry) };
        })
      });
    }

    this.stars = [];
    for (let k = 0; k < Math.round(W * 0.5); k++) this.stars.push({ x: Math.floor(r() * W), y: Math.floor(r() * wl * 0.85), p: r() * 6.28 });

    const floor = null;
    const nR = Math.max(5, Math.round(W / 13));
    this.corals = [];
    for (let k = 0; k < nR; k++) {
      const kind = r() < 0.45 ? 'fan' : 'branch';
      this.corals.push({
        x: Math.round(((k + r() * 0.9) / nR) * W),
        base: 0,
        h: 4 + Math.floor(r() * (kind === 'fan' ? 5 : 10)),
        w: 2 + Math.floor(r() * 3),
        pal: CORAL[Math.floor(r() * CORAL.length)],
        kind: kind,
        p: r() * 6.28
      });
    }

    const nF = Math.max(4, Math.round(W / 24));
    this.fish = [];
    for (let k = 0; k < nF; k++) {
      this.fish.push({
        x: r() * W,
        y: wl + 5 + r() * Math.max(6, (this.sandTop - wl - 6)),
        dir: r() < 0.5 ? 1 : -1,
        spd: 0.22 + r() * 0.5,
        s: r() < 0.35 ? 3 : 2,
        col: FISH[Math.floor(r() * FISH.length)],
        p: r() * 6.28
      });
    }

    this.bake();
    this.paint();
  }

  // baked dithered sky + water for the current minute of the day
  bake() {
    const ctx = this.ctx;
    if (!ctx) return;
    const W = this.W, H = this.H, wl = this.wl;
    const p = this.palette();
    this.pal = p;
    const sky = ramp(p.zenith, p.horizon, 8, 1.35);
    const wTop = lerp(p.horizon, [26, 86, 126], 0.62);
    this.wTop = wTop;
    const sandTop = this.sandTop;
    const deep = lerp([14, 52, 82], p.horizon, 0.12);
    const sea = ramp(wTop, deep, 14, 1.1);
    const sandLit = lerp([226, 194, 144], deep, 0.22);
    const sandDeep = lerp([146, 114, 76], deep, 0.34);
    const sand = ramp(sandLit, sandDeep, 7, 1);
    const rim = lerp(sandLit, [255, 240, 205], 0.4);
    const sandY = this.sandY || [];
    const img = ctx.createImageData(W, H);
    for (let y = 0; y < H; y++) {
      const inSand = false;
      const below = y >= wl;
      const pal = inSand ? sand : (below ? sea : sky);
      const t = below ? (y - wl) / Math.max(1, sandTop - wl - 1) : y / Math.max(1, wl - 1);
      const pos = Math.min(1, t) * (pal.length - 1);
      const i = Math.min(pal.length - 2, Math.floor(pos));
      const frac = pos - i;
      for (let x = 0; x < W; x++) {
        const thr = (BAYER[y & 3][x & 3] + 0.5) / 16;
        const sy = sandY[x] === undefined ? sandTop : sandY[x];
        let col;
        if (y >= sy) {
          const st = (y - sy) / Math.max(1, H - sy - 1);
          const sp = Math.min(1, st) * (sand.length - 1);
          const si = Math.min(sand.length - 2, Math.floor(sp));
          col = (sp - si) > thr ? sand[si + 1] : sand[si];
          if (y === sy) col = thr > 0.45 ? rim : sand[0];
          else if ((x * 7 + y * 13) % 23 === 0) col = lerp(col, [255, 245, 215], 0.35);
          else if ((x * 5 + y * 11) % 31 === 0) col = lerp(col, [90, 72, 50], 0.4);
        } else {
          col = pal[frac > thr ? i + 1 : i];
        }
        const o = (y * W + x) * 4;
        img.data[o] = col[0]; img.data[o + 1] = col[1]; img.data[o + 2] = col[2]; img.data[o + 3] = 255;
      }
    }
    this.bg = img;
  }

  rect(x, y, w, h, col, a) {
    const ctx = this.ctx;
    ctx.globalAlpha = a === undefined ? 1 : a;
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(x), Math.round(y), w, h);
  }

  computeLight() {
    const W = this.W, wl = this.wl, h = this.pal.hour;
    const day = h >= 6 && h <= 20;
    const frac = day ? (h - 6) / 14 : ((h > 20 ? h - 20 : h + 4) / 10);
    const alt = Math.sin(Math.max(0, Math.min(1, frac)) * Math.PI);
    this._lp = {
      day: day, alt: alt,
      x: Math.round(frac * (W + 12) - 6),
      y: Math.round(wl - 3 - alt * (wl - 6))
    };
    this.lightGuard = day ? null : { x: this._lp.x, y: this._lp.y, r: 17 };
  }

  // sun / moon with dithered pixel glow
  drawLight() {
    const W = this.W, p = this.pal;
    const lp = this._lp, day = lp.day, alt = lp.alt, x = lp.x, y = lp.y;
    if (!day) { this.drawMoon(x, y); this.sunUp = false; this.sunAlt = alt; this.sunX = x; return; }
    const R = 4;
    const glowR = Math.round(9 + alt * 16);
    const col = css(p.light);
    for (let dy = -glowR; dy <= glowR; dy++) {
      for (let dx = -glowR; dx <= glowR; dx++) {
        const gx = x + dx, gy = y + dy;
        if (gx < 0 || gx >= W || gy < 0 || gy >= this.H) continue;
        const d = Math.sqrt(dx * dx + dy * dy) / glowR;
        if (d > 1) continue;
        const inten = Math.pow(1 - d, 2.1) * (day ? 0.72 : 0.4);
        const thr = (BAYER[gy & 3][gx & 3] + 0.5) / 16;
        if (inten > thr * 0.85) this.rect(gx, gy, 1, 1, col, Math.min(0.85, inten * 1.1));
      }
    }
    for (let dy = -R; dy <= R; dy++) {
      const w = Math.round(Math.sqrt(Math.max(0, R * R - dy * dy)));
      if (w <= 0) continue;
      this.rect(x - w, y + dy, w * 2 + 1, 1, css(lerp(p.light, [255, 255, 255], 0.45)), 1);
    }
    this.sunX = x; this.sunUp = day && alt > 0.05; this.sunAlt = alt;
  }

  // pixel-art moon: crisp disc, soft crater shading, dithered halo
  drawMoon(x, y) {
    const W = this.W, H = this.H;
    const ROWS = [5, 9, 11, 13, 13, 13, 13, 13, 11, 9, 5];
    const halo = 15;
    for (let dy = -halo; dy <= halo; dy++) {
      for (let dx = -halo; dx <= halo; dx++) {
        const gx = x + dx, gy = y + dy;
        if (gx < 0 || gx >= W || gy < 0 || gy >= H) continue;
        const d = Math.sqrt(dx * dx + dy * dy) / halo;
        if (d > 1 || d < 0.34) continue;
        const inten = Math.pow(1 - d, 2.6) * 0.42;
        const thr = (BAYER[gy & 3][gx & 3] + 0.5) / 16;
        if (inten > thr * 0.7) this.rect(gx, gy, 1, 1, '#dfe9ff', Math.min(0.26, inten));
      }
    }
    const mid = (ROWS.length - 1) / 2;
    ROWS.forEach((w, i) => {
      const dy = i - mid;
      const half = (w - 1) / 2;
      this.rect(x - half, y + dy, w, 1, '#f4f7ff', 1);
    });
    // soft shaded limb along the lower-right, one pixel deep
    ROWS.forEach((w, i) => {
      const dy = i - mid;
      if (dy < -1) return;
      const half = (w - 1) / 2;
      this.rect(x + half - 1, y + dy, 1, 1, '#d8e0f2', 1);
    });
    // two calm craters
    [[-2, -1, 2], [2, 2, 1], [-1, 3, 1]].forEach(c => this.rect(x + c[0], y + c[1], c[2], 1, '#e2e8f7', 1));
  }

  drawStars() {
    const p = this.pal, h = p.hour;
    const night = h < 5 ? 1 : (h < 6.2 ? (6.2 - h) / 1.2 : (h > 21.5 ? Math.min(1, (h - 21.5) / 1.2) : 0));
    if (night <= 0.02) return;
    this.stars.forEach(s => {
      const tw = 0.45 + 0.55 * Math.abs(Math.sin(this.f * 0.08 + s.p));
      this.rect(s.x, s.y, 1, 1, '#e8f2ff', night * tw * 0.85);
    });
  }

  drawClouds() {
    const p = this.pal, H = this.H, wl = this.wl;
    const tint = t => css(lerp(t, p.light, p.hour > 17 || p.hour < 8 ? 0.42 : 0.12));
    const hi = tint([234, 247, 253]), body = tint([196, 226, 242]), low = tint([143, 189, 216]), edge = tint([106, 157, 189]);
    this.clouds.forEach(c => {
      const fade = Math.max(0.25, Math.min(1, 1 - c.y / Math.max(6, wl * 0.95)));
      const px = Math.round(c.x);
      const keep = this.lightGuard;
      if (keep && Math.abs(px - keep.x) < keep.r + c.r && Math.abs(c.y - keep.y) < keep.r + c.r) return;
      c.lobes.forEach(l => {
        const cx = px + Math.round(l.dx), cy = c.y + Math.round(l.dy);
        for (let y = -Math.ceil(l.ry); y <= Math.ceil(l.ry); y++) {
          const w = Math.round(l.rx * Math.sqrt(Math.max(0, 1 - (y / l.ry) * (y / l.ry))));
          if (w <= 0 || cy + y >= wl - 1) continue;
          const top = y < -l.ry * 0.34, bot = y > l.ry * 0.42;
          this.rect(cx - w, cy + y, w * 2, 1, top ? hi : (bot ? low : body), 0.4 + 0.6 * fade);
        }
      });
      c.lobes.forEach(l => {
        const cx = px + Math.round(l.dx), cy = c.y + Math.round(l.dy) + Math.ceil(l.ry);
        if (cy >= wl - 1) return;
        const w = Math.round(l.rx * 0.7);
        this.rect(cx - w, cy, w * 2, 1, edge, (0.4 + 0.6 * fade) * 0.75);
      });
    });
  }

  drawWaves() {
    const W = this.W, H = this.H, wl = this.wl, p = this.pal, t = this.f * 0.22;
    const wTop = this.wTop || [26, 86, 126];
    const crest = css(lerp(wTop, [255, 255, 255], 0.55));
    const foam = css(lerp(wTop, [255, 255, 255], 0.85));
    const deep = css(lerp(wTop, [8, 24, 40], 0.55));
    for (let x = 0; x < W; x++) {
      const s = Math.sin(x * 0.34 + t) * 1.1 + Math.sin(x * 0.11 - t * 0.6) * 1.3;
      const y = wl + Math.round(s);
      this.rect(x, y, 1, 1, crest, 0.55);
      this.rect(x, y + 1, 1, 1, deep, 0.35);
      if ((x + Math.round(t) * 2) % 11 < 2 && Math.sin(x * 0.34 + t) > 0.7) this.rect(x, y - 1, 1, 1, foam, 0.7);
    }
    // sun shimmer column on the water
    if (this.sunUp) {
      const sx = this.sunX;
      for (let y = wl + 2; y < Math.min(H, wl + 4 + this.sunAlt * (H - wl) * 0.55); y++) {
        const spread = 1 + Math.round((y - wl) * 0.42);
        for (let k = -spread; k <= spread; k++) {
          const x = sx + k + Math.round(Math.sin(y * 0.7 + this.f * 0.3) * 1.4);
          if (x < 0 || x >= W) continue;
          if ((x + y + this.f) % 3 !== 0) continue;
          const a = 0.3 * (1 - (y - wl) / ((H - wl) * 0.7)) * (1 - Math.abs(k) / (spread + 1));
          if (a > 0.02) this.rect(x, y, 1, 1, css(p.light), a);
        }
      }
    }
    // drifting current dashes
    for (let k = 0; k < Math.round(W * 0.16); k++) {
      const y = wl + 4 + ((k * 7) % Math.max(4, H - wl - 6));
      const x = Math.round((k * 23 + this.f * (0.6 + (k % 3) * 0.2)) % (W + 10)) - 5;
      this.rect(x, y, 2, 1, css(lerp(p.horizon, [255, 255, 255], 0.35)), 0.1);
    }
  }

  drawReef() {
    const light = this.sunUp ? 0.14 * this.sunAlt : 0;
    const p = this.pal;
    this.corals.forEach(c => {
      c.base = (this.sandY && this.sandY[c.x] !== undefined ? this.sandY[c.x] : this.sandTop) + 1;
      const sway = Math.sin(this.f * 0.09 + c.p);
      const tint = col => this.sunUp ? css(lerp(hexRGB(col), p.light, light)) : col;
      if (c.kind === 'fan') {
        for (let i = 0; i < c.h; i++) {
          const y = c.base - i;
          const w = Math.max(1, Math.round(c.w * 1.5 * Math.sqrt(Math.max(0.05, 1 - Math.pow(i / c.h, 1.8)))));
          const off = Math.round(sway * (i / c.h) * 1.4);
          const col = i > c.h * 0.62 ? c.pal.hi : (i > c.h * 0.28 ? c.pal.mid : c.pal.lo);
          this.rect(c.x - w + off, y, w * 2, 1, tint(col), 1);
        }
      } else {
        for (let i = 0; i < c.h; i++) {
          const y = c.base - i;
          const off = Math.round(sway * (i / c.h) * 1.8);
          this.rect(c.x + off, y, Math.max(1, c.w - 1), 1, tint(i > c.h * 0.55 ? c.pal.mid : c.pal.lo), 1);
        }
        [-1, 1].forEach((s, si) => {
          const armAt = Math.round(c.h * (si ? 0.5 : 0.66));
          for (let i = 0; i < Math.round(c.h * 0.45); i++) {
            const y = c.base - armAt - i;
            const off = Math.round(sway * ((armAt + i) / c.h) * 1.8);
            this.rect(c.x + off + s * (1 + Math.round(i * 0.6)), y, 1, 1, tint(i > c.h * 0.2 ? c.pal.hi : c.pal.mid), 1);
          }
        });
      }
    });
  }

  drawFish() {
    const p = this.pal;
    const dim = this.sunUp ? 1 : 0.72;
    this.fish.forEach(f => {
      const y = Math.round(f.y + Math.sin(this.f * 0.16 + f.p) * 1.2);
      const x = Math.round(f.x);
      const s = f.s, d = f.dir;
      const body = css(lerp(hexRGB(f.col), [255, 255, 255], 0.12), dim);
      const dark = css(lerp(hexRGB(f.col), [10, 20, 34], 0.35), dim);
      const L = s === 2 ? 5 : 7;
      const rows = s === 2 ? 3 : 4;
      for (let ry = 0; ry < rows; ry++) {
        const inset = ry === 0 || ry === rows - 1 ? 1 : 0;
        this.rect(x + inset, y - Math.floor(rows / 2) + ry, L - inset * 2, 1, ry >= rows - 2 ? dark : body, dim);
      }
      const tx = d > 0 ? x - 1 : x + L;
      const wig = Math.sin(this.f * 0.5 + f.p) > 0 ? -1 : 1;
      for (let ry = 0; ry < rows - 1; ry++) this.rect(tx, y - Math.floor(rows / 2) + ry + (ry === 0 ? wig : 0), 1, 1, dark, dim);
      this.rect(tx - (d > 0 ? 1 : -1), y + wig, 1, 1, dark, dim * 0.8);
      this.rect(x + (d > 0 ? L - 2 : 1), y - Math.floor(rows / 2) + 1, 1, 1, '#0b1220', dim);
    });
  }

  paint() {
    const ctx = this.ctx;
    if (!ctx || !this.bg) return;
    ctx.putImageData(this.bg, 0, 0);
    this.computeLight();
    this.drawStars();
    this.drawClouds();
    this.drawLight();
    this.drawWaves();
    this.drawReef();
    this.drawFish();
    ctx.globalAlpha = 1;
  }

  renderVals() {
    return { hostRef: this.hostRef, canvasRef: this.canvasRef };
  }
}

</script>
